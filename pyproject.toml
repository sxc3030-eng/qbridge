[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbridge"
version = "0.8.3"
description = "Harnais de capture/replay deterministe pour executions de circuits quantiques"
requires-python = ">=3.11"
dependencies = ["cirq>=1.7", "qsimcirq>=0.22", "numpy>=1.26"]

[project.optional-dependencies]
# Signature ed25519 uniquement. Le noyau reste sans dependance : HMAC suffit
# a l integrite, seul l opposabilite a un tiers demande de l asymetrique.
sign = ["cryptography>=41"]

[project.scripts]
qbridge = "qbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
